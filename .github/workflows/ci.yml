name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Template SDK copy is up to date
        run: node scripts/sync-template.mjs --check
      - name: Tests (compliance, vectors, bundle rules, headless Chrome)
        env:
          INTENT_APPS_REQUIRE_BROWSER: "1"
          CHROME_BIN: /usr/bin/google-chrome
        run: node --test "test/**/*.test.mjs"
      - name: Hash vectors (independent Python check)
        run: python3 scripts/verify_vectors.py
      - name: Template validates like app.install
        run: node dist/node/cli.js validate templates/quick-call
